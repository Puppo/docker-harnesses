name: AiHarness

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and publish'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  docker_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest claude-code version
        id: latest_claude
        run: |
          TAG=$(npm view @anthropic-ai/claude-code version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest codex version
        id: latest_codex
        run: |
          TAG=$(npm view @openai/codex version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest opencode version
        id: latest_opencode
        run: |
          TAG=$(npm view @opencode/cli version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest paseo version
        id: latest_paseo
        run: |
          TAG=$(npm view @getpaseo/cli version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest pi-coding-agent version
        id: latest_pi
        run: |
          TAG=$(npm view @earendil-works/pi-coding-agent version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: delpuppoluca
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Versions are passed as build args so each tool's stage has a stable
      # cache key: a tool that did not change is restored from the registry
      # cache and re-exported as the identical layer, so clients pulling the
      # new image only download and extract the tools that changed.
      #
      # Layers are compressed with zstd, which decompresses several times
      # faster than gzip on low-power clients such as a Raspberry Pi.
      # Pulling zstd layers requires Docker Engine 23 or newer.
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ai-harness
          platforms: linux/amd64,linux/arm64
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.latest_claude.outputs.tag }}
            CODEX_VERSION=${{ steps.latest_codex.outputs.tag }}
            OPENCODE_VERSION=${{ steps.latest_opencode.outputs.tag }}
            PASEO_VERSION=${{ steps.latest_paseo.outputs.tag }}
            PI_VERSION=${{ steps.latest_pi.outputs.tag }}
          labels: |
            claude_code_version=${{ steps.latest_claude.outputs.tag }}
            codex_version=${{ steps.latest_codex.outputs.tag }}
            opencode_version=${{ steps.latest_opencode.outputs.tag }}
            paseo_version=${{ steps.latest_paseo.outputs.tag }}
            pi_version=${{ steps.latest_pi.outputs.tag }}
          cache-from: type=registry,ref=delpuppoluca/ai-harness:buildcache
          cache-to: type=registry,ref=delpuppoluca/ai-harness:buildcache,mode=max
          outputs: type=image,name=delpuppoluca/ai-harness:${{ github.event.inputs.tag || 'latest' }},push=true,oci-mediatypes=true,compression=zstd,force-compression=true
