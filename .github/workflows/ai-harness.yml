name: AiHarness

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and publish'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  docker_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get latest claude-code version
        id: latest_claude
        run: |
          TAG=$(npm view @anthropic-ai/claude-code version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest codex version
        id: latest_codex
        run: |
          TAG=$(npm view @openai/codex version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get latest paseo version
        id: latest_paseo
        run: |
          TAG=$(npm view @getpaseo/cli version)
          if [ -z "$TAG" ]; then
            echo "Failed to fetch latest version" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and publish image
        uses: ilteoood/docker_buildx@master
        with:
          tag: ${{ github.event.inputs.tag || 'latest' }}
          platform: linux/amd64,linux/arm64
          imageName: delpuppoluca/ai-harness
          dockerFile: Dockerfile.ai-harness
          label: claude_code_version=${{ steps.latest_claude.outputs.tag }},codex_version=${{ steps.latest_codex.outputs.tag }},paseo_version=${{ steps.latest_paseo.outputs.tag }}
          publish: true
          dockerUser: delpuppoluca
          dockerPassword: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}